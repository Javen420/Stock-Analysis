services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  backend:
    build: ./backend
    ports:
      - "5000:5000"
    environment:
      MONGO_URI: mongodb://mongo:27017/stockfinder
      JWT_SECRET: ${JWT_SECRET}
      PORT: 5000
    depends_on:
      - mongo

  python:
    build: ./python
    ports:
      - "8002:8000"
    environment:
      MONGO_URI: mongodb://mongo:27017/stock_db
      JWT_SECRET: ${JWT_SECRET}
      ALPHA_VANTAGE_KEY: ${ALPHA_VANTAGE_KEY}
    depends_on:
      - mongo

  frontend:
    build: ./vite-project
    ports:
      - "5173:5173"
    depends_on:
      - backend
      - python

volumes:
  mongo-data:
